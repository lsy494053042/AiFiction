book_id: your-book-id
title: 作品名
genre: 题材
platform: 目标平台
stage: planning
status: active

evaluation_policy:
  use_workspace_stop_loss_rule: true
  override_stop_loss_word_count:

active_volume: 1
active_chapter: 0

paths:
  root_dir: .
  settings_dir: 00-设定
  outlines_dir: 01-大纲
  chapters_dir: 02-正文
  artifacts_dir: 03-中间产物

source_of_truth:
  project_brief: 00-设定/作品定位.md
  world_settings: 00-设定/世界设定.md
  character_settings: 00-设定/角色设定.md
  master_outline: 01-大纲/全书大纲.md
  active_volume_outline: 01-大纲/卷一大纲.md

current_focus:
  task_type: planning
  task_label: 整卷先规划
  goal: 先完成整卷功能、阶段事件、节奏配比，再开始正文
  summary: 不再按“写几章补几章”的方式推进，正文只能建立在完整骨架之后。
hard_constraints: []

planning_budget:
  chapter_target_chars:
    min: 2000
    max: 2500
  volume_target:
    chapters_min: 0
    chapters_max: 0
    chars_min: 0
    chars_max: 0
  budget_gate:
    require_check_before_next_batch: true
    current_status: pending

prewrite_gate:
  require_full_volume_plan_before_drafting: true
  current_volume_plan_complete: false
  current_stage_map_complete: false
  current_chapter_function_mix_defined: false
  current_transition_daily_slots_defined: false
  current_batch_ready_to_write: false

rhythm_plan:
  chapter_function_mix:
    main_push: 35-45%
    transition: 15-25%
    relationship: 10-20%
    daily_life: 10-15%
    information: 10-15%
    payoff: 5-10%
  hard_rules:
    - 强钩子次章必须先接，不允许直接跳到第二天。
    - 每个阶段至少保留一章关系章和一章日常/缓冲章。
    - 基础信息要早清楚，核心真相可以后置。
    - 每章先定义功能，再决定是否进入正文。

execution_controls:
  planning_first:
    required_prewrite_sequence:
      - full-volume-plan
      - stage-map
      - chapter-function-mix
      - transition-and-daily-slots
      - current-batch-outline
  verification_before_completion:
    require_evidence_before_mark_done: true
    required_after_current_batch:
      - writing:meta-check
      - writing:budget-check
  root_cause_first:
    require_issue_classification_before_rewrite: true
    allowed_rewrite_triggers:
      - planning-gap
      - continuity-gap
      - anchor-gap
      - knowledge-layer-gap
      - exposition-gap
      - pacing-gap
      - volume-budget-gap
      - execution-bug

knowledge_state:
  inherit_workspace_workflow: true
  active_global_profile: default-global
  active_book_profile: default-book
  current_batch_id:
  current_batch_review_required: true
  current_batch_review_status: pending
  opening_arc_status: pending
  next_required_review_at_chapter: 3
  enabled_rule_sets:
    - continuity
    - opening-arc
    - anchoring
    - exposition
    - pacing

last_outputs:
  latest_chapter_file:
  latest_summary_file:
  latest_review_file:
  latest_sync_source:

sync:
  auto_sync_enabled: true
  root_source: 02-正文
  include_patterns:
    - "*.md"
    - "*.txt"
  exclude_patterns:
    - ".git/**"
    - "node_modules/**"
    - "dist/**"

proposal_commit:
  auto_commit_low_risk: true
  require_manual_commit_for:
    - factual-conflict
    - timeline-conflict
    - major-relationship-shift
    - rule-break


