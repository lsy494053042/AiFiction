workspace_id: your-workspace-id
workspace_name: Your Workspace
root_dir: .
books_dir: books

active_book_id:
default_book_id:

book_index: []

defaults:
  chapter_file_pattern: "{index:04d}-{title}.md"
  encoding: utf-8
  auto_sync_after_finalize: true
  context_pack_dirname: 03-中间产物/context-packs
  proposal_dirname: 03-中间产物/proposals

knowledge_workflow:
  batch_size: 5
  require_batch_review_before_next_batch: true
  auto_create_candidates_from_feedback: true
  opening_arc_review_points: [3, 5, 10]
  phase_review_word_counts: [30000, 50000]
  active_budget:
    global_rules: 12
    book_rules: 12
    batch_focus_findings: 5
    total_book_rules: 20
    total_validated_global_rules: 30
  promotion_policy:
    book_only_after_hits: 2
    validated_global_after_batch_hits: 3
    validated_global_after_book_hits: 2
  enabled_gates:
    - batch-review-required
    - meta-language-check
    - continuity-review
    - opening-arc-review
    - prewrite-plan-required
    - rhythm-plan-required
    - volume-budget-check
