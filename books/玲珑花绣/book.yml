current_focus:
  task_type: drafting
  task_label: 第二卷回扫完成，第三卷完整章纲待建
  goal: 第二卷正文和整卷回扫已完成；下一步先规划第三卷完整章纲，禁止直接开正文。
  summary: 第二卷 0037-0072 已完成并回扫，内容覆盖港口城、猎人考试外围、正式考试、猎物岛、最终面试和执照收束。卷尾已接到友克鑫、地下拍卖、白箱、旧牌局和砾线索。下一步先拆友克鑫信息秩序，再完成第三卷完整章纲。
publication:
  target_platform: 起点中文网（男频）
  target_platform_locked: true
  total_target_word_count: 1000000
  total_target_word_count_locked: true
  stop_loss_word_count: 250000
  stop_loss_word_count_locked: true
  chapter_target_word_count:
    min: 2000
    max: 2500
    locked: true
  daily_word_target: 4000
  update_cadence: 日更
evaluation_policy:
  use_workspace_stop_loss_rule: true
  override_stop_loss_word_count: 250000
hard_constraints:
  - 单章目标字数 2000-2500
  - 分卷按内容优先测算，不先拍章数
  - 正文前必须先完成整卷规划和全章定位
  - 每卷开正文前必须完成当前卷完整章纲，禁止只做前十章或批次章纲就开正文
  - 主角不是现代穿越者，不知道全职猎人剧情
  - 原作大事件写就必须让晏决有目标、有行动、有变量、有后果
  - 重要人物必须有自己的声线和行动逻辑，不能写成功能 NPC
  - 正文前必须完成本书专属设定底盘和当前卷完整章纲
planning_budget:
  sizing_method: content-first
  chapter_target_chars:
    min: 2000
    max: 2500
  volume_target:
    chapters_min: 36
    chapters_max: 36
    chars_min: 72000
    chars_max: 90000
  budget_gate:
    require_check_before_next_batch: true
    current_status: volume-2-full-review-complete-pending-volume-3-plan
prewrite_gate:
  require_full_volume_plan_before_drafting: true
  current_platform_locked: true
  current_stop_loss_locked: true
  current_total_target_locked: true
  current_chapter_target_locked: true
  previous_volume_post_review_complete: true
  previous_volume_text_scan_complete: true
  previous_volume_sync_complete: true
  current_volume_plan_complete: false
  current_stage_map_complete: false
  current_chapter_function_mix_defined: false
  current_transition_daily_slots_defined: false
  current_full_chapter_positioning_complete: false
  current_batch_outline_complete: false
  current_volume_sized_by_content_first: false
  current_volume_budget_locked: false
  current_budget_alignment_verified: false
  current_batch_ready_to_write: false
rhythm_plan:
  chapter_function_mix:
    main_push: 45-55%
    transition: 10-20%
    relationship: 5-10%
    daily_life: 5-10%
    information: 10-15%
    payoff: 10-15%
  hard_rules:
    - 前三章必须至少连续两次直给钩子。
    - 每个小阶段都要有一次看得见的阶段性兑现。
    - 关系章不能连续吃掉两章以上的主线推进。
execution_controls:
  planning_first:
    required_prewrite_sequence:
      - platform-lock
      - stop-loss-lock
      - total-word-target-lock
      - chapter-word-target-lock
      - volume-budget-content-first
      - full-volume-plan
      - stage-map
      - chapter-function-mix
      - transition-and-daily-slots
      - full-volume-chapter-positioning
      - current-batch-outline
  verification_before_completion:
    require_evidence_before_mark_done: true
    required_after_current_batch:
      - writing:meta-check
      - writing:budget-check
  root_cause_first:
    require_issue_classification_before_rewrite: true
    allowed_rewrite_triggers:
      - planning-gap
      - continuity-gap
      - anchor-gap
      - knowledge-layer-gap
      - exposition-gap
      - pacing-gap
      - volume-budget-gap
      - execution-bug
      - hook-weakness
