hard_constraints:
  - 旧稿内容全部作废，除非重新写入当前核心文档
  - 未完成卷级章纲前不得进入正文
  - 单章目标字数为 2000 到 2500 字
  - 25 万字为止损线，到点必须整体复核
  - 当前阶段先定根基，不允许沿旧稿做补丁式续写
sync:
  auto_sync_enabled: true
  root_source: 00-设定
  include_patterns:
    - "*.md"
    - "*.txt"
  exclude_patterns:
    - .git/**
    - node_modules/**
    - dist/**
