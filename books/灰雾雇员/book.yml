hard_constraints:
  - 主角的功能是中枢、调度、结算和修复，不是常规一线战斗员。
  - 主角不长期亲自下场的核心原因，是组织必须把个人能力转成体系能力，而不是让老板永久兼职前线。
  - 本书主驱动力是异常处理、主神空间修复、组织生态建立与对抗污染，不是宫斗、权谋或势力争霸。
  - 大型组织不仅意味着规模感，还意味着金字塔结构、普通支撑岗位、内部交易体系和小社会生态。
  - AI 以被动交互为主，实时支援尽量伪装成员工协同。
  - 招募对象必须是有门槛的本地原住民精英，不是普通路人。
  - 前期异常规模保持克制，以微型异常节点、调查、回收和局部清剿为主。
  - 单章目标字数固定为 2000 至 2500 字。
  - 全书目标字数暂定 100 万字，止损线 25 万字。
  - 组织最终目标是建立人类一侧的异常处理秩序，而不是单纯做大做强。
  - 分卷必须先按内容职责单元划分，再校准字数，最后才落章数。
  - 每次开新卷后，必须先锁定整卷章纲，再切当前批次章纲，不允许回到“写几章、规划几章”的推进方式。
  - 新书正式落地前，必须先试写10章；只有试写结果整体过线，才允许正式回填大纲、章纲与协议状态。
  - 正文默认按10章一组输出；只有在连贯性风险过高、单组信息量过重或卷体量不适合时，才允许降到5章；整卷未完成，不进入下一卷。
  - 正文不能直接套通用模板，必须服从《灰雾雇员》专属写作卡。
  - 当前第01组旧稿已判无效，不允许在旧稿上直接续写。
