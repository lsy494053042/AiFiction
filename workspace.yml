workspace_id: aifiction-workspace
workspace_name: AiFiction Workspace
root_dir: .
books_dir: books
active_book_id: 玲珑花绣
default_book_id: hui-wu-gu-yuan
book_index:
  - book_id: hui-wu-gu-yuan
    title: 灰雾雇员
    root_path: books/灰雾雇员
    book_file: books/灰雾雇员/book.yml
    stage: drafting
    status: planning
  - book_id: 玲珑花绣
    title: 玲珑花绣
    root_path: books/玲珑花绣
    book_file: books/玲珑花绣/book.yml
    stage: planning
    status: planning
defaults:
  chapter_file_pattern: "{index:04d}-{title}.md"
  encoding: utf-8
  auto_sync_after_finalize: true
  context_pack_dirname: 03-中间产物/context-packs
  proposal_dirname: 03-中间产物/proposals
plugins:
  api_version: "1"
  bundles:
    - core-default
    - topic-qidian-male-longform
  enabled: []
  disabled: []
  strict_mode: false
book_starters:
  default_profile_key: qidian-male-longform
  profiles:
    - profile_key: qidian-male-longform
      label: 起点男频长篇
      description: 默认用于起点男频、百万字级别、2000-2500 章均的连载项目。
      genre: 男频网文
      target_platform: 起点中文网（男频）
      total_target_word_count: 1000000
      stop_loss_word_count: 250000
      chapter_target_word_count:
        min: 2000
        max: 2500
      daily_word_target: 4000
      update_cadence: 日更
      plugin_bundles:
        - topic-qidian-male-longform
      hard_constraints:
        - 单章目标字数 2000-2500
        - 分卷按内容优先测算，不先拍章数
        - 正文前必须先完成整卷规划和全章定位
      focus_task_type: planning
      focus_task_label: 开书规划
      focus_goal: 先完成平台、止损线、整卷规划、阶段图和批次章纲，再进入正文。
      focus_summary: 先固化设定和大纲骨架，正文只建立在完整规划之后。
    - profile_key: qidian-female-longform
      label: 起点女频长篇
      description: 默认用于起点女频、长篇连载、稳定日更项目。
      genre: 女频网文
      target_platform: 起点中文网（女频）
      total_target_word_count: 800000
      stop_loss_word_count: 200000
      chapter_target_word_count:
        min: 2000
        max: 2500
      daily_word_target: 4000
      update_cadence: 日更
      plugin_bundles:
        - topic-qidian-female-longform
      hard_constraints:
        - 单章目标字数 2000-2500
        - 开正文前必须锁定平台、总字数、止损线和卷体量
      focus_task_type: planning
      focus_task_label: 开书规划
      focus_goal: 先完成作品定位、核心关系线、卷级规划和当前批次章纲。
      focus_summary: 先把感情线、人物锚点和卷级推进关系钉死，再进正文。
    - profile_key: serial-experimental
      label: 实验连载
      description: 用于先快速验证概念、再决定是否扩成长篇的实验型项目。
      genre: 实验项目
      target_platform: 待定
      total_target_word_count: 300000
      stop_loss_word_count: 80000
      chapter_target_word_count:
        min: 1800
        max: 2200
      daily_word_target: 2500
      update_cadence: 灵活
      plugin_bundles:
        - topic-serial-experimental
      hard_constraints:
        - 先验证题材与钩子，不提前承诺超长总盘子
        - 实验阶段每一卷都要有独立止损节点
      focus_task_type: planning
      focus_task_label: 概念验证
      focus_goal: 先验证题材卖点、主线闭环和前 5-10 章抓力。
      focus_summary: 这是试跑型项目，先证明读者抓力和结构闭环，再决定是否扩盘。
knowledge_workflow:
  batch_size: 5
  require_batch_review_before_next_batch: true
  auto_create_candidates_from_feedback: true
  opening_arc_review_points:
    - 3
    - 5
    - 10
  phase_review_word_counts:
    - 30000
    - 50000
  active_budget:
    global_rules: 12
    book_rules: 12
    batch_focus_findings: 5
    total_book_rules: 20
    total_validated_global_rules: 30
  promotion_policy:
    book_only_after_hits: 2
    validated_global_after_batch_hits: 3
    validated_global_after_book_hits: 2
  enabled_gates:
    - batch-review-required
    - meta-language-check
    - continuity-review
    - anchoring-review
    - opening-arc-review
    - prewrite-plan-required
    - rhythm-plan-required
    - volume-budget-check
execution_policy:
  planning_first:
    require_full_volume_plan_before_drafting: true
    require_stage_map_before_batch_drafting: true
    require_current_batch_outline_before_drafting: true
  verification_before_completion:
    require_evidence_before_mark_done: true
    required_after_batch:
      - writing:meta-check
      - writing:budget-check
    required_before_claiming_completion:
      - encoding:check
      - db:protocol-smoke
  root_cause_first:
    require_issue_classification_before_rewrite: true
    default_categories:
      - planning-gap
      - continuity-gap
      - anchor-gap
      - knowledge-layer-gap
      - exposition-gap
      - pacing-gap
      - volume-budget-gap
      - execution-bug
task_routing:
  create_book:
    trigger_examples:
      - 新开一本都市悬疑
      - 创建一本男频长篇
    default_stage: planning
  continue_book:
    trigger_examples:
      - 继续写这本书
      - 接着推进当前作品
    use_active_book: true
  write_chapter:
    trigger_examples:
      - 写第12章
      - 继续写正文
    required_context_pack: writing-pack
  investigate_risk:
    trigger_examples:
      - 排查这个风险
      - 看看哪里写崩了
    required_context_pack: risk-investigation-pack
